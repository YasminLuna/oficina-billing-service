name: Billing Phase 4 - quality and local Kubernetes manifests
on:
  workflow_dispatch:
  pull_request:
    branches: [main, feature/fase4-service]
  push:
    branches: [feature/fase4-service]
permissions:
  contents: read
jobs:
  quality:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.13'
      - name: Install dependencies
        run: |
          pip install -r requirements-dev.txt
          pip install ruff==0.13.0
      - name: Critical static analysis
        run: ruff check --select E4,E7,E9,F app tests
      - name: Unit tests and coverage threshold
        run: python -m pytest --cov=app --cov-report=term-missing --cov-report=xml --cov-fail-under=80
      - name: Validate Kubernetes YAML structure
        run: |
          python -m pip install PyYAML==6.0.2
          python -c 'import yaml; docs=list(yaml.safe_load_all(open("k8s/local-service.yaml"))); assert {"Deployment","Service"} <= {d["kind"] for d in docs if d}; print("Kubernetes YAML valid")'
      - name: Build image
        run: docker build -t oficina-billing-service:ci .
      - name: Upload coverage report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: billing-coverage
          path: coverage.xml
          if-no-files-found: ignore

  deploy-kind:
    needs: quality
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: helm/kind-action@v1.12.0
        with:
          cluster_name: fase4-ci
      - name: Build and load image
        run: |
          docker build -t oficina-billing-service:local .
          kind load docker-image oficina-billing-service:local --name fase4-ci
      - name: Deploy to ephemeral Kubernetes
        run: |
          kubectl --context kind-fase4-ci create namespace fiap-fase4
          kubectl --context kind-fase4-ci -n fiap-fase4 apply -f k8s/local-service.yaml
          kubectl --context kind-fase4-ci -n fiap-fase4 rollout status deployment/oficina-billing-service --timeout=180s
      - name: Verify HTTP readiness
        run: |
          kubectl --context kind-fase4-ci -n fiap-fase4 port-forward svc/oficina-billing-service 18080:8080 >/tmp/forward.log 2>&1 &
          PID=$!
          trap 'kill "$PID" 2>/dev/null || true' EXIT
          curl --fail --retry 15 --retry-connrefused --retry-delay 2 http://localhost:18080/health
          curl --fail http://localhost:18080/openapi.json -o /tmp/openapi.json
      - name: Collect deployment evidence
        if: always()
        run: kubectl --context kind-fase4-ci -n fiap-fase4 get deployments,pods,pvc,svc -o wide
